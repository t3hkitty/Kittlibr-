name: Build Kittlibr (APK and Web Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: true

jobs:
  test-suite:
    name: Run Unit & Integration Tests (Koodo Reader + AnyMD + WebDAV Fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies (rclone)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rclone

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pyyaml xxhash pydantic httpx
          npm install -g tsx

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Debug Keystore if Absent
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || echo "Wrapper initialization fallback"
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kittlibr-Android-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  deploy-pages:
    name: Deploy to GitHub Pages (Public Repos / Paid Plan)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp app/index.html _site/index.html
          cp -r public _site/public || true
          cp -r src _site/src || true
          cp app/.nojekyll _site/.nojekyll || touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
