version: '3.8'

services:
  kittlibr:
    build:
      context: .
      dockerfile: Dockerfile
    image: t3hkitty/kittlibr:latest
    container_name: kittlibr
    restart: unless-stopped
    ports:
      - "8080:8080"   # Kittlibr Web Reader UI
      - "3050:3050"   # AnyMD Loopback Daemon & Sharded Indexer
      - "5572:5572"   # Rclone Non-FUSE JSON-RPC (Speed-Tuned)
      - "5820:5820"   # librmanage Calibre & Metadata Engine
    environment:
      - SERVE_WEB=1
      - WEB_PORT=8080
      - WEB_HOST=0.0.0.0
      - ANYMD_HOST=0.0.0.0
      - ANYMD_PORT=3050
      - LIBRMANAGE_HOST=0.0.0.0
      - LIBRMANAGE_PORT=5820
      - RCLONE_BIND_ADDR=0.0.0.0:5572
      - RCLONE_RCD_URL=http://127.0.0.1:5572
      - RCLONE_RC_USER=kittlibr
      - RCLONE_RC_PASS=wordsaremagic
      - KITTLIBR_STAGING_DIR=/app/staging_cache
    volumes:
      - kittlibr_vault:/app/staging_cache

volumes:
  kittlibr_vault:
    name: kittlibr_vault_data
